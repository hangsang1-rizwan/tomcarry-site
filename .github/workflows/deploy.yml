name: Deploy to Cloudways

# Auto-deploys on every push to main by calling the Cloudways API to trigger
# the app's git pull. Uses a Cloudways Access Token (Bearer) — no manual click.
# Retries on HTTP 422 ("operation already in progress for this server"), which
# happens when the sibling site on the same server is mid-deploy.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: cloudways-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudways git pull
        env:
          CW_TOKEN: ${{ secrets.CLOUDWAYS_API_KEY }}
        run: |
          set -o pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Attempt ${attempt}: triggering git pull for app 6730665 (server 1196670)..."
            HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" --request POST \
              --url "https://api.cloudways.com/api/v1/git/pull" \
              --header "Authorization: Bearer ${CW_TOKEN}" \
              --header "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "server_id=1196670" \
              --data-urlencode "app_id=6730665" \
              --data-urlencode "branch_name=main" \
              --data-urlencode "deploy_path=")
            echo "HTTP ${HTTP}"; cat /tmp/resp.json; echo
            if [ "${HTTP}" = "200" ]; then
              echo "==> Deploy triggered successfully."; exit 0
            fi
            if [ "${HTTP}" = "422" ]; then
              echo "Server busy (another deploy in progress). Waiting 30s..."; sleep 30; continue
            fi
            echo "::error::Cloudways git pull failed (HTTP ${HTTP}). 401 = token missing Git scope; 404 = Git deployment not set up."
            exit 1
          done
          echo "::error::Server stayed busy after 8 attempts."
          exit 1
